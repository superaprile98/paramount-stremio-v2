# docker-compose.yml — produzione (Docker-first)
#
# Setup pulito e sicuro:
#   - init: true            → PID 1 corretto (reaping zombie, segnali a Node)
#   - cap_drop: [ALL]       → nessuna capability Linux superflua
#   - no-new-privileges     → blocca escalation di privilegi
#   - volume named          → .data (sessioni + prefs) sopravvive a rebuild/restart
#   - log rotation          → max 10 MB × 3 file, niente disco pieno
#   - mem_limit: 2g         → cap generoso (next start ≈ 150 MB RSS + proxy HLS)
#   - healthcheck           → /api/health per orchestrazione
#
# Uso:
#   cp .env.example .env   # poi imposta KEY_SECRET e BASE_URL
#   docker compose up -d --build

services:
  # ── Proxy VLESS/Hysteria2/VMess/Trojan/SS via sing-box ────────────────────
  # OPZIONALE: si attiva con `docker compose --profile vpn up -d --build`.
  #
  # L'utente incolla una subscription URL (o un singolo share-link) nella UI
  # /configure → /api/vpn/setup (mode vless). L'addon scarica la lista dei
  # server, genera config.json e lo scrive in ./vpn-data/sing-box/config.json
  # (bind-mount qui sotto). La systemd path unit
  # (scripts/install-vpn-watcher.sh) osserva il file e riavvia il container
  # automaticamente, niente SSH.
  #
  # sing-box espone un proxy HTTP locale (porta 8888) raggiungibile dal
  # container paramount come http://sing-box:8888. La porta NON è esposta
  # sull'host: il proxy è usato solo dal traffico del container paramount.
  # Il failover tra più server è gestito internamente da sing-box (urltest).
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box
    restart: unless-stopped
    profiles:
      - vpn
    # L'immagine ufficiale ha ENTRYPOINT=[sing-box] e CMD vuoto: senza
    # argomenti stampa l'help ed esce. Passiamo esplicitamente `run -c`.
    command: [ "run", "-c", "/etc/sing-box/config.json" ]
    # Nessuna capability speciale: sing-box fa solo proxy HTTP in uscita,
    # niente TUN/NET_ADMIN (a differenza di gluetun).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Config generata dall'addon (UI /configure → /api/vpn/setup).
      # Il file deve esistere prima di `up` (lo creano gli script
      # install-vpn-watcher.sh / restart-sing-box.sh / deploy-vpn-update.sh).
      - SING_BOX_CONFIG=/etc/sing-box/config.json
    volumes:
      # Bind-mount condiviso con l'addon: l'addon scrive qui config.json
      # (via UI /configure → /api/vpn/setup). Stesso path sull'host →
      # accessibile anche da scripts/restart-sing-box.sh.
      - ./vpn-data/sing-box:/etc/sing-box
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # sing-box non ha un health endpoint HTTP: `wget http://127.0.0.1:8888`
      # NON funziona (il proxy HTTP chiude la connessione senza URL assoluto →
      # healthcheck sempre "starting"). Usiamo `nc -z` per verificare solo che
      # la porta 8888 sia in ascolto (TCP connect).
      test: [ "CMD", "nc", "-z", "127.0.0.1", "8888" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  paramount:
    build:
      context: .
      dockerfile: Dockerfile
    image: paramount-stremio:latest
    container_name: paramount-stremio
    init: true
    restart: unless-stopped
    # Esegue il container con uid 1001 (stesso dell'utente host `ubuntu`).
    # Necessario per scrivere nel bind-mount ./vpn-data (la cui proprietà è
    # ereditata dall'utente host che ha creato la cartella). Senza questa riga
    # il container gira come uid 1000 (node) e fallisce con EACCES su config.json.
    user: "1001:1001"
    depends_on:
      sing-box:
        condition: service_healthy
        required: false
    env_file:
      - .env
    environment:
      # I valori vengono letti dal file .env (vedi .env.example).
      # KEY_SECRET è obbligatoria: se manca, docker compose fallisce all'avvio.
      - BASE_URL=${BASE_URL:-http://localhost:7850}
      - PORT=${PORT:-7850}
      - KEY_SECRET=${KEY_SECRET:?Set KEY_SECRET in .env (e.g. openssl rand -hex 32)}
      - FORCE_HQ=${FORCE_HQ:-}
      # Proxy per le chiamate verso Paramount+.
      # - Se PROXY_URLS è valorizzato: lista comma-separated (round-robin + fallback).
      # - Altrimenti: usa il proxy sing-box locale (VLESS/Hysteria2/...).
      - PROXY_URLS=${PROXY_URLS:-http://sing-box:8888}
      - HTTP_PROXY=${HTTP_PROXY:-}
      # Persistenza prefs (squadre preferite, leghe nascoste) dentro il volume.
      - PREFS_DIR=/app/.data/prefs
    ports:
      - "${PORT:-7850}:${PORT:-7850}"
    volumes:
      # Sessioni Paramount (cookies cifrati JWE) + prefs sportive.
      # Il volume named evita problemi di ownership (l'immagine gira come uid 1001,
      # impostato via `user: "1001:1001"` sopra per matchare l'host `ubuntu`).
      - paramount-data:/app/.data
      # Bind-mount condiviso con sing-box: l'addon scrive qui config.json
      # (via UI /configure → /api/vpn/setup). Stesso path sull'host →
      # accessibile anche da scripts/restart-sing-box.sh.
      - ./vpn-data:/app/.data/vpn
    # Network esterne a cui il container deve collegarsi.
    # `server-stack_default` è la network di Nginx Proxy Manager (presente se
    # hai installato NPM con docker compose in una cartella `server-stack/`).
    # Grazie a questa network, NPM può raggiungere il container col nome
    # `paramount-stremio` invece di dover usare l'IP dell'host.
    # Se NON usi NPM con docker compose (es. binario o altro stack), commenta
    # le righe `server-stack_default` qui sotto e nella sezione `networks:`.
    networks:
      - default
      - server-stack_default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-7850}/api/health" ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  paramount-data:

networks:
  default:
    name: paramount-stremio_default
  # Network di Nginx Proxy Manager: esiste già sull'host (creata dal suo
  # docker-compose). La dichiariamo come `external: true` perché NON dobbiamo
  # crearla noi. Se in futuro la network non esiste più, `docker compose up`
  # fallirà: in quel caso commenta le righe `server-stack_default` (sia qui
  # sia nella sezione `services.paramount.networks`).
  server-stack_default:
    name: server-stack_default
    external: true
