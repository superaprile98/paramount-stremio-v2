# docker-compose.yml — produzione (Docker-first)
#
# Setup pulito e sicuro:
#   - init: true            → PID 1 corretto (reaping zombie, segnali a Node)
#   - cap_drop: [ALL]       → nessuna capability Linux superflua
#   - no-new-privileges     → blocca escalation di privilegi
#   - volume named          → .data (sessioni + prefs) sopravvive a rebuild/restart
#   - log rotation          → max 10 MB × 3 file, niente disco pieno
#   - mem_limit: 2g         → cap generoso (next start ≈ 150 MB RSS + proxy HLS)
#   - healthcheck           → /api/health per orchestrazione
#
# Uso:
#   cp .env.example .env   # poi imposta KEY_SECRET e BASE_URL
#   docker compose up -d --build

services:
  # ── Tunnel VPN ProtonVPN (OpenVPN login) via gluetun ─────────────────────
  # OPZIONALE: si attiva con `docker compose --profile vpn up -d --build`.
  #
  # Autenticazione con credenziali OpenVPN/IKEv2 di Proton (NON la password
  # dell'account Proton). Si prendono da:
  #   account.protonvpn.com → Account → OpenVPN/IKEv2 credentials
  # (es. username "utente+pmp" con password dedicata).
  #
  # Le credenziali vengono scritte dall'addon in vpn-data/gluetun.env
  # (via UI /configure → /api/vpn/setup) e montate come env_file qui sotto.
  # NON servono chiavi WireGuard né SSH: la UI fa tutto.
  #
  # Espone un proxy HTTP locale (porta 8888) raggiungibile dal container
  # paramount come http://gluetun:8888.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    profiles:
      - vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # env_file scritto dall'addon (UI /configure). Contiene OPENVPN_USER,
    # OPENVPN_PASSWORD, SERVER_COUNTRIES. Stesso path sull'host → la systemd
    # path unit (scripts/install-gluetun-watcher.sh) osserva le modifiche e
    # riavvia gluetun automaticamente, niente SSH.
    volumes:
      - ./vpn-data/gluetun.env:/gluetun/gluetun.env:ro
    env_file:
      - /gluetun/gluetun.env
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      # Abilita il proxy HTTP locale (ascolta su 8888 di default).
      - HTTP_PROXY=on
      # DNS: usa i DNS di ProtonVPN per evitare leak.
      - DNS_ADDRESS=10.2.0.1
    # NON esporre il proxy all'esterno: il container paramount lo raggiunge
    # via rete interna. Se vuoi testarlo dall'host, aggiungi:
    #   ports:
    #     - "8888:8888"
    #     - "8000:8000/tcp"   # control server (solo debug)
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8000/v1/health" ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  paramount:
    build:
      context: .
      dockerfile: Dockerfile
    image: paramount-stremio:latest
    container_name: paramount-stremio
    init: true
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        required: false
    env_file:
      - .env
    environment:
      # I valori vengono letti dal file .env (vedi .env.example).
      # KEY_SECRET è obbligatoria: se manca, docker compose fallisce all'avvio.
      - BASE_URL=${BASE_URL:-http://localhost:7850}
      - PORT=${PORT:-7850}
      - KEY_SECRET=${KEY_SECRET:?Set KEY_SECRET in .env (e.g. openssl rand -hex 32)}
      - FORCE_HQ=${FORCE_HQ:-}
      # Proxy per le chiamate verso Paramount+.
      # - Se PROXY_URLS è valorizzato: lista comma-separated (round-robin + fallback).
      # - Altrimenti: usa il tunnel ProtonVPN locale via gluetun.
      - PROXY_URLS=${PROXY_URLS:-http://gluetun:8888}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - MFP_URL=${MFP_URL:-}
      - MFP_PASS=${MFP_PASS:-}
      # Persistenza prefs (squadre preferite, leghe nascoste) dentro il volume.
      - PREFS_DIR=/app/.data/prefs
    ports:
      - "${PORT:-7850}:${PORT:-7850}"
    volumes:
      # Sessioni Paramount (cookies cifrati JWE) + prefs sportive.
      # Il volume named evita problemi di ownership (l'immagine gira come uid 1000).
      - paramount-data:/app/.data
      # Bind-mount condiviso con gluetun: l'addon scrive qui il .conf WireGuard
      # (via UI /configure → /api/vpn/setup). Stesso path sull'host → accessibile
      # anche da scripts/restart-gluetun.sh.
      - ./vpn-data:/app/.data/vpn
    # Network esterne a cui il container deve collegarsi.
    # `server-stack_default` è la network di Nginx Proxy Manager (presente se
    # hai installato NPM con docker compose in una cartella `server-stack/`).
    # Grazie a questa network, NPM può raggiungere il container col nome
    # `paramount-stremio` invece di dover usare l'IP dell'host.
    # Se NON usi NPM con docker compose (es. binario o altro stack), commenta
    # le righe `server-stack_default` qui sotto e nella sezione `networks:`.
    networks:
      - default
      - server-stack_default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-7850}/api/health" ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  paramount-data:

networks:
  default:
    name: paramount-stremio_default
  # Network di Nginx Proxy Manager: esiste già sull'host (creata dal suo
  # docker-compose). La dichiariamo come `external: true` perché NON dobbiamo
  # crearla noi. Se in futuro la network non esiste più, `docker compose up`
  # fallirà: in quel caso commenta le righe `server-stack_default` (sia qui
  # sia nella sezione `services.paramount.networks`).
  server-stack_default:
    name: server-stack_default
    external: true
